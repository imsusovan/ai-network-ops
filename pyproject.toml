[tool.black]
line-length = 100
target-version = ["py310"]
exclude = '''
/(
  \.git
  | \.pytest_cache
  | \.ruff_cache
  | venv
  | reports
  | rag/chroma_db
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".pytest_cache",
    ".ruff_cache",
    "venv",
    "reports",
    "rag/chroma_db",
]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B904"]
"mcp_server/server.py" = ["B904"]
"rag/*.py" = ["B904"]
